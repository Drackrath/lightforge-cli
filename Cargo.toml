[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "1.0.0-beta.11"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/Drackrath/lightforge-cli"
homepage = "https://github.com/Drackrath/lightforge-cli"

[workspace.dependencies]
lightforge-core = { path = "crates/core" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
# `lightforge completions`.
clap_complete = "4"
directories = "5"
flate2 = "1"
# Proton-CachyOS ships .tar.xz. Builds the reference liblzma from vendored
# source, so no system library is needed at run time.
liblzma = { version = "0.4", features = ["static"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
md5 = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "0.10"
# Process scanning for pre-flight (`preflight::scan`).
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
# Builds the tests' fixtures; core decodes BLTE itself (`tact::blte`).
blte = "0.4"
tact-parser = "0.4"
tar = "0.4"
tempfile = "3"
# Round-trip tests. No `fork`/`timeout`: no test here can hang or abort.
proptest = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false }
# The log file. `fmt` and `tracing-log` only: `env-filter` would pull in a
# regex engine for a filter that `Targets` and one environment variable cover.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry", "tracing-log"] }
# Closing the window Battle.net raises during a hand-off (`battlenet::window`).
# No features: the pure-Rust connection, so nothing links libxcb.
x11rb = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
# Addon packages are plain deflate zips; nothing else is needed, and the
# default feature set drags in bzip2/zstd/aes for formats WoW never uses.
zip = { version = "2", default-features = false, features = ["deflate"] }
# WTF backups. The C library, not a pure-Rust port: the backup before a launch
# blocks Play, and only the reference encoder is fast at a useful ratio.
zstd = { version = "0.14", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
# The release assets are the bare binary, so it ships without symbols.
strip = "symbols"

[workspace.lints.rust]
# Set by `cargo fuzz` for the harness in `core/src/fuzzing.rs`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
cast_possible_truncation = "warn"
unwrap_used = "warn"
